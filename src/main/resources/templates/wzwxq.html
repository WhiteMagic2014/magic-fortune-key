<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>喵喵财富密码 - 今日幸运彩票</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="css/hui/H-ui.min.css"/>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 12px 40px;
            background: linear-gradient(160deg, #eaf6ff 0%, #c9e9ff 45%, #a8dcff 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            color: #1f4d73;
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #1673b9;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #5b8db3;
            margin-top: 8px;
            line-height: 1.8;
        }

        .card {
            margin-top: 22px;
            background: rgba(255, 255, 255, .78);
            border: 1px solid rgba(22, 115, 185, .18);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 6px 18px rgba(22, 115, 185, .12);
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: bold;
            color: #1673b9;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(22, 115, 185, .35);
            border-radius: 8px;
            background: #fff;
            color: #1f4d73;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #57b8f5;
            box-shadow: 0 0 0 3px rgba(87, 184, 245, .18);
        }

        .btn {
            display: block;
            width: 100%;
            height: 46px;
            margin-top: 16px;
            background: linear-gradient(90deg, #57b8f5, #1673b9);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 4px;
            box-shadow: 0 4px 12px rgba(22, 115, 185, .28);
            transition: opacity .2s;
        }

        .btn:hover {
            opacity: .92;
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .result-tip {
            font-size: 14px;
            color: #1673b9;
            text-align: center;
            font-weight: bold;
        }

        .result-tip b {
            color: #0f5f9e;
            letter-spacing: 2px;
        }

        .result-desc {
            margin-top: 6px;
            font-size: 12px;
            color: #6f96b8;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .item {
            background: #fff;
            border: 1px solid rgba(22, 115, 185, .22);
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 4px 10px rgba(22, 115, 185, .1);
            animation: pop .35s ease both;
        }

        @keyframes pop {
            from {
                transform: scale(.85);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .item .pic {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: #eaf6ff;
        }

        .item .ph {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: #1673b9;
            background: #eaf6ff;
        }

        .item .idx {
            padding: 8px 0;
            font-size: 13px;
            color: #1673b9;
            background: #f2f9ff;
            border-top: 1px solid rgba(22, 115, 185, .15);
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item .idx .nid {
            font-size: 11px;
            font-weight: normal;
            color: #7ea6c8;
            margin-left: 2px;
        }

        .err {
            margin-top: 12px;
            color: #d9534f;
            font-size: 13px;
            text-align: center;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: #5b8db3;
        }

        .footer a {
            color: #1673b9;
        }

        .disclaimer {
            margin-top: 10px;
            font-size: 11px;
            color: #8aa9c4;
            line-height: 1.8;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="title">喵喵财富密码 - 万象棋版</div>
    <div class="subtitle">
        输入你的专属「财富密码」，为你算出本期的幸运彩票<br/>
        同一个财富密码，同一天算出的幸运彩票完全相同
    </div>

    <div class="card">
        <label for="pwd">请输入财富密码:</label>
        <textarea id="pwd" rows="5" placeholder="输入你的财富密码，例如：生日、昵称、口头禅..."></textarea>
        <button class="btn" id="submit" onclick="lottery()">算 一 算</button>
        <div class="err" id="err"></div>
    </div>

    <div class="card" id="resultCard" style="display:none;">
        <div class="grid" id="grid" style="margin-top:16px;"></div>
    </div>

    <div class="footer">
        <span>如果对你有帮助的话，不妨给我一个star吧</span><br/>
        <a href="https://github.com/WhiteMagic2014/magic-fortune-key.git" target="_blank">点我去Github</a>
        <div class="disclaimer">本站结果由财富密码计算生成，仅供娱乐，不作为任何购彩建议</div>
    </div>
</div>

<script src="jquery/jquery-3.7.1.min.js"></script>
<script src="common.util.js"></script>
<script th:inline="javascript">
    // 奖池为 0 ~ 15，下标即接口返回的 id，图片放在 static/img/ 下
    var wzwxqImgs = [
        "img/1.png", "img/2.png", "img/3.png", "img/4.png",
        "img/5.png", "img/6.png", "img/7.png", "img/8.png", "img/9.png",
        "img/10.png", "img/11.png", "img/12.png", "img/13.png", "img/14.png",
        "img/15.png", "img/16.png", "img/17.png", "img/18.png", "img/19.png", "img/20.png"
    ];

    // 奖池中角色名字，下标对应奖池 id，按实际角色名替换即可
    var wzwxqNames = [
        "嬴律", "白歌", "镜", "班叔", "昭君",
        "姜导", "小妲己", "弈星", "孙小宾", "马可",
        "常小娥", "阿离", "明先生", "庄小鱼", "乔汐",
        "玉环", "瑶妹", "香香", "安其拉", "闹闹"
    ];

    function lottery() {
        var cafumima = $.trim($("#pwd").val());
        $("#err").text("");
        if (!cafumima) {
            $("#err").text("请先输入财富密码");
            return;
        }
        $("#submit").prop("disabled", true).text("计算中...");
        $.ajax({
            data: {cafumima: cafumima},
            type: "POST",
            url: getApiPath() + '/wzwxqLottery',
            success: function (data) {
                render(data);
            },
            error: function () {
                $("#err").text("计算失败，请稍后重试");
            },
            complete: function () {
                $("#submit").prop("disabled", false).text("算 一 算");
            }
        });
    }

    function render(list) {
        if (!list || !list.length) {
            $("#err").text("没能算出幸运彩票，换个财富密码试试");
            return;
        }
        var $grid = $("#grid").empty();
        $.each(list, function (i, id) {
            var name = wzwxqNames[id] || ("角色" + id);
            var src = wzwxqImgs[id];
            var $item = $('<div class="item"></div>');
            if (src) {
                var $img = $('<img class="pic">').attr("src", src).attr("alt", name);
                // 图片缺失时回退为占位块，避免页面出现裂图
                $img.on("error", function () {
                    $(this).replaceWith('<div class="ph">' + name + '</div>');
                });
                $item.append($img);
            } else {
                $item.append('<div class="ph">' + name + '</div>');
            }
            $item.append('<div class="idx">' + name + ' <span class="nid">#' + id + '</span></div>');
            $grid.append($item);
        });
        $("#resultCard").show();
    }

    $(function () {
        $("#pwd").on("keydown", function (e) {
            if (e.ctrlKey && e.keyCode === 13) {
                lottery();
            }
        });
    });
</script>
</body>
</html>
